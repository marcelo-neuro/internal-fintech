services:
  #Postgres server
  postgres:
    image: postgres:14-alpine
    container_name: dev-postgresql
    environment:
      POSTGRES_DB: internal_fintech_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234567
    ports:
      - "5433:5432"
    networks:
      - dev-network
    volumes:
      - pg-data:/var/lib/postgresql/data

  #PgAdmin
  pg-admin:
    image: dpage/pgadmin4
    container_name: dev-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: me@example.com
      PGADMIN_DEFAULT_PASSWORD: 1234567
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  pg-data:
  pgadmin-data: